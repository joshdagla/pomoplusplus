<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomo++</title>
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <style>
      body {
        font-family: "Cairo", sans-serif;
        font-weight: bold;
        background-color: #fff4e6;
        color: #3b2a20;
      }

      @font-face {
        font-family: "Cairo";
        src: url("/static/fonts/cario/Cario-Semibold.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      .form-control {
        background-color: #fffbf6;
        color: #3b2a20;
        border-color: #6b5446;
      }

      .form-control::placeholder {
        color: #3b2a20;
      }

      .form-control:focus {
        background-color: #fffbf6;
        color: #3b2a20;
        border-color: #e04b33;
        box-shadow: 0 0 0 0.2rem rgba(224, 75, 51, 0.25);
      }

      button.submit-btn,
      button.submit-btn:focus {
        background-color: #d94530;
        border-color: #d94530;
        color: #fffbf6;
      }

      button.submit-btn:hover,
      button.submit-btn:active {
        background-color: #b8351f;
        border-color: #b8351f;
      }

      .border-secondary {
        border-color: #d9b99b !important;
      }

      #register-form-toggle u,
      #login-form-toggle u {
        color: #c23a24 !important;
      }
    </style>

    <main class="container py-4">
      <h1>Welcome to Pomo++ {{name}}</h1>
      <div class="timer-container">
        <button id="pomodorobtn" class="active">Pomodoro</button>
        <button id="shortbrkbtn">Shortbreak</button>
        <button id="longbrkbtn">Long break</button>
      </div>
      <div class="pomdoro-count"></div>
      <div class="progressbar">
        <div class="progrsbar-inner">
          <h2 class="progressbar-number">25:00</h2>
        </div>
      </div>
      <div class="function-buttons">
        <button id="startbtn">Start</button>
        <button id="pausebtn">Pause</button>
        <button id="resetbtn">Reset</button>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
