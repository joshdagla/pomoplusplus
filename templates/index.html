<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomo++</title>
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <style>
      body {
        font-family: "Cairo", sans-serif;
        font-weight: 600;
        background-color: #fff4e6;
        color: #3b2a20;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
      }

      .app-navbar {
        background-color: #fcebda;
        border-bottom: 1px solid #d9b99b;
        box-shadow: 0 2px 8px rgba(59, 42, 32, 0.08);
        padding: 6px 0;
      }

      .brand-text {
        font-size: 2rem;
        font-weight: 700;
        color: #3b2a20;
      }

      .app-navbar .nav-link {
        color: #3b2a20;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
        transition:
          background-color 0.15s,
          color 0.15s;
      }

      .app-navbar .nav-link:hover,
      .app-navbar .nav-link:focus {
        color: #d94530;
        background-color: #f3d9bf;
      }

      .nav-btn {
        --bs-btn-bg: #d94530;
        --bs-btn-border-color: #d94530;
        --bs-btn-color: #fffbf6;
        --bs-btn-hover-bg: #b8351f;
        --bs-btn-hover-border-color: #b8351f;
        --bs-btn-hover-color: #fffbf6;
        --bs-btn-active-bg: #b8351f;
        --bs-btn-active-border-color: #b8351f;
        --bs-btn-active-color: #fffbf6;
        border-radius: 8px;
        font-weight: 600;
      }

      .navbar-toggler {
        border-color: #d9b99b;
      }

      .navbar-toggler:focus {
        box-shadow: 0 0 0 0.2rem rgba(224, 75, 51, 0.25);
      }

      @font-face {
        font-family: "Cairo";
        src: url("/static/fonts/cario/Cario-Semibold.otf") format("opentype");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      /* Card */
      .container {
        margin: 24px auto;
        margin-top: 100px;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 24px;
        background-color: #fcebda;
        border: 1px solid #d9b99b;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(59, 42, 32, 0.12);
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 24px;
        text-align: center;
      }

      /* Mode buttons */
      .timer-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin-bottom: 28px;
      }

      .timer-container button {
        padding: 8px 14px;
        border: 1px solid #d9b99b;
        border-radius: 999px;
        background-color: transparent;
        color: #3b2a20;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s,
          border-color 0.15s;
      }

      .timer-container button:hover {
        background-color: #f3d9bf;
      }

      .timer-container .active {
        background-color: #d94530;
        border-color: #d94530;
        color: #fffbf6;
      }

      #longbrkbtn {
        display: none;
      }

      .pomdoro-count {
        margin-bottom: 20px;
        display: none;
        font-weight: 700;
      }

      /* Timer ring */
      .progressbar {
        height: 200px;
        width: 200px;
        background: conic-gradient(#d94530 0deg, #e8cdb4 0deg);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 3s infinite;
        margin-bottom: 32px;
      }

      .progrsbar-inner {
        height: 90%;
        width: 90%;
        background: #fff4e6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .progressbar-number {
        color: #3b2a20;
        font-weight: 700;
        font-size: 2.2rem;
        margin: 0;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.98);
        }
        50% {
          transform: scale(1);
        }
        100% {
          transform: scale(0.98);
        }
      }

      /* Control buttons */
      .function-buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
      }

      #startbtn,
      #pausebtn,
      #resetbtn {
        padding: 10px 22px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color 0.15s,
          transform 0.15s;
      }

      .function-buttons button:hover {
        transform: translateY(-1px);
      }

      #startbtn {
        background-color: #d94530;
        color: #fffbf6;
      }
      #startbtn:hover {
        background-color: #b8351f;
      }

      #pausebtn {
        background-color: #6b5446;
        color: #fff4e6;
      }
      #pausebtn:hover {
        background-color: #54402f;
      }

      #resetbtn {
        background-color: transparent;
        border-color: #d9b99b;
        color: #3b2a20;
      }
      #resetbtn:hover {
        background-color: #f3d9bf;
      }

      .footer {
        margin-top: auto;
      }
    </style>

    <nav class="navbar navbar-expand-lg fixed-top app-navbar">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <img
            src="/static/assets/tomato_icon.png"
            alt="Pomo++ Icon"
            width="36"
            height="36"
          />
          <span class="brand-text">Pomo++</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <li class="nav-item">
              <!-- TODO: Add routing to About Page -->
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://github.com/joshdagla">Github</a>
            </li>
            <!-- TODO: Clear session token before logging user out -->
            <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
              <a class="btn nav-btn" href="/">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <h1>Welcome to Pomo++ {{name}}</h1>
      <div class="timer-container">
        <button id="pomodorobtn" class="active">Pomodoro</button>
        <button id="shortbrkbtn">Shortbreak</button>
        <button id="longbrkbtn">Long break</button>
      </div>
      <div class="pomdoro-count"></div>
      <div class="progressbar">
        <div class="progrsbar-inner">
          <h2 class="progressbar-number">25:00</h2>
        </div>
      </div>
      <div class="function-buttons">
        <button id="startbtn">Start</button>
        <button id="pausebtn">Pause</button>
        <button id="resetbtn">Reset</button>
      </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/index.js"></script>
  </body>
</html>
