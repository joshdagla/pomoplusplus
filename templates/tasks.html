<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomo++</title>
    <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link href="/static/style.css" rel="stylesheet" />
  </head>

  <body>
    <style>
      @font-face {
        font-family: "Cairo";
        src: url("/static/fonts/cario/Cario-Semibold.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        font-size: 110%;
      }
    </style>
    <nav class="navbar navbar-expand-lg fixed-top app-navbar">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <img
            src="/static/assets/tomato_icon.png"
            alt="Pomo++ Icon"
            width="36"
            height="36"
          />
          <span class="brand-text">Pomo++</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <li class="nav-item">
              <a class="nav-link" href="/home">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
            <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
              <a class="btn nav-btn" id="logout-btn" href="/">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="mt-4">
      <section class="task-card">
        <div class="task-header">
          <h2>Removed Tasks</h2>
        </div>

        <p id="removed-error" class="task-error"></p>
        <ul id="removed-list" class="task-list"></ul>
        <p id="removed-empty" class="task-empty" style="display: none">
          No removed tasks.
        </p>
      </section>
    </main>

    <div
      class="modal fade task-modal"
      id="delete-modal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Delete task permanently?</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-2">
              You are about to delete "<strong id="delete-task-name"></strong>".
            </p>
            <p class="task-error fw-bold">
              This will permanently remove the task and cannot be undone.
            </p>
            <p id="delete-error" class="task-error"></p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn task-cancel"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" id="delete-confirm" class="btn task-save">
              Delete permanently
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <img
        src="/static/assets/tomato_art.png"
        alt="Pomodoro art"
        class="footer-art"
      />

      <div class="footer-center">
        <ul class="footer-links">
          <li><a href="#">About</a></li>
          <li><a href="https://github.com/joshdagla">Github</a></li>
        </ul>
        <small class="footer-copy">© 2026 Pomo++. All rights reserved.</small>
      </div>

      <img
        src="/static/assets/tomato_art_invert.png"
        alt="Pomodoro art"
        class="footer-art"
      />
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      $(function () {
        $("#logout-btn").on("click", function (e) {
          e.preventDefault();

          $.ajax({
            url: "/auth/logout",
            method: "POST",
          })
            .done(function () {
              window.location.replace("/");
            })
            .fail(function () {
              alert("Could not log out. Please try again.");
            });
        });
        const $list = $("#removed-list");
        const $empty = $("#removed-empty");
        const $error = $("#removed-error");

        const modalEl = document.getElementById("delete-modal");
        const modal = new bootstrap.Modal(modalEl);
        const $confirm = $("#delete-confirm");
        const $deleteName = $("#delete-task-name");
        const $deleteError = $("#delete-error");
        let pendingId = null;

        const ICON_DELETE =
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';

        function errMsg(xhr) {
          if (xhr.responseJSON?.message) return xhr.responseJSON.message;

          const text = xhr.responseText || "";
          if (text.trimStart().startsWith("<")) {
            return `Unexpected response from the server (status ${xhr.status}).`;
          }

          return text || "Something went wrong";
        }

        function renderTask(task) {
          const count = Number(task.pomodoros);

          const $main = $('<div class="task-main"></div>');
          $main.append(
            $('<span class="task-desc"></span>').text(task.description),
          );

          const $meta = $('<span class="task-meta"></span>');
          $meta.append(
            '<img src="/static/assets/tomato_icon.png" alt="" width="14" height="14" />',
          );
          $meta.append(
            document.createTextNode(
              `${count} pomodoro${count === 1 ? "" : "s"}`,
            ),
          );
          $main.append($meta);

          const $actions = $('<div class="task-actions"></div>').append(
            $(
              '<button type="button" class="task-icon-btn task-delete" title="Delete permanently" aria-label="Delete permanently"></button>',
            ).html(ICON_DELETE),
          );

          $('<li class="task-item task-enter"></li>')
            .attr("data-id", task.id)
            .append($main, $actions)
            .appendTo($list);
        }

        // Load removed tasks
        $.ajax({
          url: "/api/getAll",
          method: "GET",
          dataType: "json",
        })
          .done(function (res) {
            const tasks = Array.isArray(res.tasks)
              ? res.tasks
              : Array.isArray(res.message)
                ? res.message
                : [];

            $list.empty();
            tasks.forEach(renderTask);
            $empty.toggle(tasks.length === 0);
          })
          .fail(function (xhr) {
            $error.text(errMsg(xhr));
          });

        // Step 1: the trash icon only opens the confirmation dialog
        $list.on("click", ".task-delete", function () {
          const $li = $(this).closest(".task-item");
          pendingId = Number($li.attr("data-id"));
          $deleteName.text($li.find(".task-desc").text());
          $deleteError.text("");
          modal.show();
        });

        // Step 2: only this button actually deletes
        $confirm.on("click", function () {
          if (pendingId === null) return;
          const id = pendingId;

          $confirm.prop("disabled", true);

          $.ajax({
            url: "/api/delete",
            method: "DELETE",
            contentType: "application/json",
            data: JSON.stringify({ taskId: id }),
            dataType: "json",
          })
            .done(function () {
              modal.hide();
              const $li = $list.children(`[data-id="${id}"]`);
              $li.addClass("task-leave");
              setTimeout(function () {
                $li.remove();
                $empty.toggle($list.children().length === 0);
              }, 200);
            })
            .fail(function (xhr) {
              $deleteError.text(errMsg(xhr));
            })
            .always(function () {
              $confirm.prop("disabled", false);
            });
        });

        modalEl.addEventListener("hidden.bs.modal", function () {
          pendingId = null;
        });
      });
    </script>
  </body>
</html>
